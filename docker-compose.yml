services:
  db:
    image: postgres:16-alpine
    container_name: unicampus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MySecurePass2026!
      POSTGRES_DB: unicampus_laf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unicampus_laf"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unicampus_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:MySecurePass2026!@db:5432/unicampus_laf
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - PROJECT_NAME=Campus Lost & Found System
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python docker_entrypoint.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unicampus_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
